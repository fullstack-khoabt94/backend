spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/tasklog}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migrations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  refresh-token:
    secret: ${REFRESH_TOKEN_SECRET}
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS}
  resetpw-token:
    expiration-ms: ${RESETPW_TOKEN_EXPIRATION_MS}
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never


---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG