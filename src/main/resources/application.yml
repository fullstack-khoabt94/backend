spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/tasklog}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migrations
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-token:
    secret: ${REFRESH_TOKEN_SECRET}
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:86400000}
  resetpw-token:
    expiration-ms: ${RESETPW_TOKEN_EXPIRATION_MS:3600000}
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
