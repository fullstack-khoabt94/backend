version: "3.8"

services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tasklog
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: